<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소래고 일정 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f7;--surface:#fff;--ink:#14213d;--muted:#5b6780;--line:#d8dfeb;--accent:#14213d;--onaccent:#fff;--today:#e7eefc;
--k0:#2f6fed;--k1:#d6455d;--k2:#13906a;--k3:#b07a00;--k4:#7b6fd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--surface:#171f35;--ink:#e8edf8;--muted:#9aa6c0;--line:#2a3555;--accent:#e8edf8;--onaccent:#0e1424;--today:#1f2c52;
--k0:#7aa2ff;--k1:#ff7f93;--k2:#4fd1a5;--k3:#e6b84a;--k4:#b3a9f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--surface:#171f35;--ink:#e8edf8;--muted:#9aa6c0;--line:#2a3555;--accent:#e8edf8;--onaccent:#0e1424;--today:#1f2c52;--k0:#7aa2ff;--k1:#ff7f93;--k2:#4fd1a5;--k3:#e6b84a;--k4:#b3a9f5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.6rem;margin:0;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.bar h2{margin:0;font-size:1.2rem}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:500}
:focus-visible{outline:2px solid var(--k0);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{background:var(--surface);text-align:center;font-size:.8rem;color:var(--muted);padding:6px 0}
.dow:first-child{color:var(--k1)}.dow:nth-child(7){color:var(--k0)}
.day{background:var(--surface);min-height:84px;padding:4px;text-align:left;border:0;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.day.out{opacity:.4}
.day.today{background:var(--today)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day b{font-size:.8rem;font-weight:500}
.day.sun b{color:var(--k1)}.day.sat b{color:var(--k0)}
.tag{font-size:.7rem;line-height:1.25;padding:1px 4px;border-radius:4px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:.68rem;color:var(--muted)}
@media (max-width:520px){.day{min-height:62px}.tag{font-size:0;padding:0;height:6px;border-left:0;background:var(--c);border-radius:3px}}
form{display:grid;gap:10px}
label{display:grid;gap:3px;font-size:.85rem;color:var(--muted)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px}
.list{display:grid;gap:8px;margin-top:6px}
.item{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:9px 11px;display:grid;gap:2px}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item strong{font-weight:700;overflow-wrap:anywhere}
.dd{font-size:.8rem;font-weight:700;color:var(--c);white-space:nowrap}
.meta{font-size:.82rem;color:var(--muted)}
.memo{font-size:.85rem;overflow-wrap:anywhere}
.mini{display:flex;gap:10px;margin-top:2px}
.mini button{background:none;border:0;padding:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline}
.empty{color:var(--muted);font-size:.9rem;padding:10px 0}
.k0{--c:var(--k0)}.k1{--c:var(--k1)}.k2{--c:var(--k2)}.k3{--c:var(--k3)}.k4{--c:var(--k4)}
.side{display:grid;gap:16px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>소래고 일정 노트</h1>
  <p id="st" aria-live="polite">수행평가·지필평가·동아리 일정을 한곳에 기록해요.</p>
  <div class="acts" id="lgbox"><input id="em" type="email" placeholder="이메일" aria-label="이메일" style="width:190px"><button class="btn primary" id="lm">로그인 링크 받기</button><button class="btn" id="lg2">Google</button></div>
  <button class="btn" id="logout" hidden>로그아웃</button>
</header>
<div class="grid">
  <section class="card" aria-label="월간 달력">
    <div class="bar">
      <h2 id="ym"></h2>
      <div class="acts">
        <button class="btn" id="prev" aria-label="이전 달">이전</button>
        <button class="btn" id="now">오늘</button>
        <button class="btn" id="next" aria-label="다음 달">다음</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="cal" id="cal"></div>
  </section>
  <div class="side">
    <section class="card" aria-label="공지">
      <div class="bar"><h2>공지</h2></div>
      <div class="list" id="nl"></div>
      <form id="nf" hidden style="margin-top:12px">
        <label>공지 제목<input id="nt" maxlength="60"></label>
        <label>내용<textarea id="nb" rows="2" maxlength="300"></textarea></label>
        <button class="btn primary" type="submit">공지 올리기</button>
      </form>
    </section>
    <section class="card" aria-label="일정 입력">
      <div class="bar"><h2 id="ftitle">일정 추가</h2></div>
      <form id="f">
        <label>제목<input id="t" required maxlength="60" placeholder="예: 국어 수행평가 발표"></label>
        <div class="row">
          <label>분류<select id="c"></select></label>
          <label>시작일<input id="d" type="date" required></label>
        </div>
        <label>종료일 (여러 날이면)<input id="e" type="date"></label>
        <label>메모<textarea id="m" rows="2" maxlength="200" placeholder="준비물, 범위, 장소 등"></textarea></label>
        <div class="acts">
          <button class="btn primary" id="sv" type="submit">저장</button>
          <button class="btn" id="cx" type="button" hidden>수정 취소</button>
        </div>
      </form>
    </section>
    <section class="card" aria-label="일정 목록">
      <div class="bar"><h2 id="ltitle"></h2><button class="btn" id="clr" hidden>다가오는 일정</button></div>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.84.0/dist/umd/supabase.js"></script>
<script>
var CATS=['수행평가','지필평가','동아리','행사','기타'];
var KEY='sorae-planner-v1';
var ev=[],view=new Date(),sel=null,filt=null,editId=null;
view.setDate(1);
try{ev=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(x){ev=[]}
/* ===== Supabase 설정: 아래 값을 본인 프로젝트 값으로 바꾸세요 ===== */
var SB_URL="https://zwjwafiuttlsgugbtskg.supabase.co";
var SB_KEY="sb_publishable_FPC5lHRCKnIK0tSFYQLhwA_HWNZXASl";
var ADMIN_EMAIL="sorae.s2510724@ggh.goe.go.kr";
/* ============================================================== */
var sb=null,uid=null,isAdmin=false,notices=[];
var OK='모든 기기에 동기화됨',FAIL='동기화에 실패했어요. 이 기기에는 저장됐어요.';
function setSt(t){$('st').textContent=t}
function loc(){try{localStorage.setItem(KEY,JSON.stringify(ev))}catch(x){}}
function save(){loc();
  if(uid){setSt('동기화 중…');
    sb.from('planners').upsert({user_id:uid,events:ev,updated_at:new Date().toISOString()}).then(function(r){setSt(r.error?FAIL:OK)})}}
function pull(first){
  return sb.from('planners').select('events').eq('user_id',uid).maybeSingle().then(function(r){
    if(r.error){setSt(FAIL);return}
    var cloud=r.data&&Array.isArray(r.data.events)?r.data.events:null;
    if(first){
      var ids={};(cloud||[]).forEach(function(e){ids[e.id]=1});
      var add=ev.filter(function(e){return !ids[e.id]});
      ev=(cloud||[]).concat(add);
      if(add.length||!cloud)save();else{loc();setSt(OK)}
    }else if(cloud){ev=cloud;loc();setSt(OK)}
    draw();
  });
}
function nd(n){var t=new Date(n.created_at);return (t.getMonth()+1)+'/'+t.getDate()}
function drawN(){
  $('nl').innerHTML=notices.length?notices.map(function(n){
    return '<div class="item k3"><div class="top"><strong>'+esc(n.title)+'</strong><span class="dd">'+nd(n)+'</span></div>'+
    (n.body?'<div class="memo">'+esc(n.body)+'</div>':'')+(isAdmin?'<div class="mini"><button data-nd="'+n.id+'">삭제</button></div>':'')+'</div>'
  }).join(''):'<div class="empty">등록된 공지가 없어요.</div>';
  $('nf').hidden=!isAdmin;
}
function loadN(){
  return sb.from('notices').select('*').order('created_at',{ascending:false}).limit(20).then(function(r){
    if(r.error){$('nl').innerHTML='<div class="empty">공지를 불러오지 못했어요.</div>';return}
    notices=r.data||[];drawN()});
}
function initSync(){
  $('nl').innerHTML='<div class="empty">불러오는 중…</div>';
  if(String(SB_URL).indexOf('여기에')===0||typeof supabase==='undefined'){
    setSt('Supabase 설정 전이에요. 지금은 이 기기에만 저장돼요.');
    $('nl').innerHTML='<div class="empty">Supabase 설정 후 공지를 볼 수 있어요.</div>';$('lgbox').hidden=true;return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  var back=location.origin+location.pathname;
  loadN();
  $('lm').onclick=function(){var e=$('em').value.trim();if(!e){$('em').focus();return}
    sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:back}}).then(function(r){
      setSt(r.error?'링크를 보내지 못했어요. 잠시 뒤 다시 시도해 주세요.':'메일로 로그인 링크를 보냈어요. 메일의 링크를 눌러 주세요.')})};
  $('lg2').onclick=function(){sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:back}})};
  $('logout').onclick=function(){sb.auth.signOut()};
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&uid)pull(false)});
  setSt('로그인하면 여러 기기에서 일정이 동기화돼요.');
  sb.auth.onAuthStateChange(function(ev2,session){
    var u=session&&session.user;
    if(u){uid=u.id;isAdmin=!!ADMIN_EMAIL&&u.email===ADMIN_EMAIL;$('lgbox').hidden=true;$('logout').hidden=false;
      setSt('동기화 연결 중…');setTimeout(function(){pull(true)},0)}
    else{uid=null;isAdmin=false;$('lgbox').hidden=false;$('logout').hidden=true;setSt('로그인하면 여러 기기에서 일정이 동기화돼요.')}
    drawN();
  });
  $('nf').onsubmit=function(x){x.preventDefault();var t=$('nt').value.trim();if(!t)return;
    sb.from('notices').insert({title:t,body:$('nb').value.trim()}).then(function(r){
      if(r.error){alert('공지를 올리지 못했어요. 공지 작성자 계정으로 로그인했는지 확인해 주세요.');return}
      $('nf').reset();loadN()})};
  $('nl').onclick=function(x){var id=x.target.dataset.nd;
    if(id&&confirm('이 공지를 삭제할까요?'))sb.from('notices').delete().eq('id',id).then(loadN)};
}
function p(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}
function days(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function endOf(e){return e.end||e.date}
function on(k){return ev.filter(function(e){return e.date<=k&&k<=endOf(e)&&(filt===null||e.cat===filt)})}
function dd(e){var t=ymd(new Date());
  if(e.date<=t&&t<=endOf(e))return e.date===endOf(e)?'D-DAY':'진행 중';
  var n=days(t,e.date);return n>0?'D-'+n:'D+'+(-n)}
function fmtR(e){var a=e.date.slice(5).replace('-','/');return e.end&&e.end!==e.date?a+' ~ '+e.end.slice(5).replace('-','/'):a}

$('c').innerHTML=CATS.map(function(n){return '<option>'+n+'</option>'}).join('');
function chips(){
  var h='<button class="chip" aria-pressed="'+(filt===null)+'" data-f="">전체</button>';
  CATS.forEach(function(n,i){h+='<button class="chip k'+i+'" aria-pressed="'+(filt===n)+'" data-f="'+n+'"><i></i>'+n+'</button>'});
  $('chips').innerHTML=h;
}
function cal(){
  var y=view.getFullYear(),m=view.getMonth(),t=ymd(new Date());
  $('ym').textContent=y+'년 '+(m+1)+'월';
  var h='';['일','월','화','수','목','금','토'].forEach(function(d){h+='<div class="dow">'+d+'</div>'});
  var start=new Date(y,m,1-new Date(y,m,1).getDay());
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=ymd(d),es=on(k);
    var cls='day'+(d.getMonth()!==m?' out':'')+(k===t?' today':'')+(k===sel?' sel':'')+(d.getDay()===0?' sun':'')+(d.getDay()===6?' sat':'');
    h+='<button class="'+cls+'" data-d="'+k+'"><b>'+d.getDate()+'</b>';
    es.slice(0,3).forEach(function(e){h+='<span class="tag k'+CATS.indexOf(e.cat)+'">'+esc(e.title)+'</span>'});
    if(es.length>3)h+='<span class="more">+'+(es.length-3)+'개 더</span>';
    h+='</button>';
  }
  $('cal').innerHTML=h;
}
function list(){
  var t=ymd(new Date()),rows;
  if(sel){rows=on(sel);$('ltitle').textContent=sel.slice(5).replace('-','월 ')+'일 일정';$('clr').hidden=false}
  else{rows=ev.filter(function(e){return endOf(e)>=t&&(filt===null||e.cat===filt)}).sort(function(a,b){return a.date<b.date?-1:1}).slice(0,12);
    $('ltitle').textContent='다가오는 일정';$('clr').hidden=true}
  $('list').innerHTML=rows.length?rows.map(function(e){
    return '<div class="item k'+CATS.indexOf(e.cat)+'"><div class="top"><strong>'+esc(e.title)+'</strong><span class="dd">'+dd(e)+'</span></div>'+
    '<div class="meta">'+e.cat+' · '+fmtR(e)+'</div>'+(e.memo?'<div class="memo">'+esc(e.memo)+'</div>':'')+
    '<div class="mini"><button data-ed="'+e.id+'">수정</button><button data-del="'+e.id+'">삭제</button></div></div>'
  }).join(''):'<div class="empty">'+(sel?'이 날은 등록된 일정이 없어요. 위 입력란에서 추가해 보세요.':'다가오는 일정이 없어요. 첫 일정을 추가해 보세요.')+'</div>';
}
function draw(){chips();cal();list()}
function resetForm(){editId=null;$('f').reset();$('d').value=sel||ymd(new Date());$('ftitle').textContent='일정 추가';$('sv').textContent='저장';$('cx').hidden=true}

$('chips').onclick=function(x){var b=x.target.closest('[data-f]');if(!b)return;filt=b.dataset.f||null;draw()};
$('cal').onclick=function(x){var b=x.target.closest('[data-d]');if(!b)return;
  sel=(sel===b.dataset.d)?null:b.dataset.d;
  var d=new Date(b.dataset.d+'T00:00:00');if(d.getMonth()!==view.getMonth()){view=new Date(d.getFullYear(),d.getMonth(),1)}
  if(!editId)$('d').value=b.dataset.d;draw()};
$('prev').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);cal()};
$('next').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);cal()};
$('now').onclick=function(){view=new Date();view.setDate(1);cal()};
$('clr').onclick=function(){sel=null;draw()};
$('cx').onclick=resetForm;
$('list').onclick=function(x){
  var ed=x.target.dataset.ed,de=x.target.dataset.del;
  if(de){if(confirm('이 일정을 삭제할까요?')){ev=ev.filter(function(e){return e.id!==de});save();if(editId===de)resetForm();draw()}}
  if(ed){var e=ev.filter(function(q){return q.id===ed})[0];if(!e)return;editId=ed;
    $('t').value=e.title;$('c').value=e.cat;$('d').value=e.date;$('e').value=e.end||'';$('m').value=e.memo||'';
    $('ftitle').textContent='일정 수정';$('sv').textContent='수정 저장';$('cx').hidden=false;$('t').focus()}
};
$('f').onsubmit=function(x){x.preventDefault();
  var o={title:$('t').value.trim(),cat:$('c').value,date:$('d').value,end:$('e').value,memo:$('m').value.trim()};
  if(!o.title||!o.date)return;
  if(o.end&&o.end<o.date){alert('종료일은 시작일보다 빠를 수 없어요.');return}
  if(editId){ev=ev.map(function(e){return e.id===editId?Object.assign({id:editId},o):e})}
  else{o.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);ev.push(o)}
  save();var d=new Date(o.date+'T00:00:00');view=new Date(d.getFullYear(),d.getMonth(),1);
  resetForm();draw()};
resetForm();draw();initSync();
</script>
</body>
</html>
